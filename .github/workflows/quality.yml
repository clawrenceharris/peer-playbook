name: Quality

on:
  pull_request:
  push:
    branches:
      - development
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run types:check
      - run: npm run lint -- --max-warnings=0
      - run: npm run test:unit
      - run: npm test -- src/test/architecture/domain-boundaries.test.ts
